<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Travel Recommendations</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
        }

        nav {
            background-color: #333;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav a {
            color: white;
            margin-right: 20px;
            text-decoration: none;
            font-weight: bold;
        }

        nav a:hover {
            color: yellow;
        }

        .search-section input {
            padding: 6px;
        }

        .search-section button {
            padding: 6px 10px;
            margin-left: 5px;
            cursor: pointer;
        }

        #results {
            padding: 20px;
        }

        img {
            margin: 10px;
            border-radius: 8px;
            border: 1px solid #ccc; /* Helps see where an image should be */
        }
    </style>
</head>

<body>

    <nav>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="contact.html">Contact Us</a>
        </div>

        <div class="search-section">
            <input type="text" placeholder="Search destinations..." id="searchInput">
            <button onclick="searchDestination()">Search</button>
            <button onclick="clearSearch()">Clear</button>
        </div>
    </nav>

    <h1>Welcome to Travel Explorer</h1>

    <p>Discover amazing travel destinations around the world including beaches, temples and beautiful countries.</p>

    <div id="results"></div>

    <script>
        function searchDestination() {
            let input = document.getElementById("searchInput").value.toLowerCase().trim();
            let results = document.getElementById("results");

            results.innerHTML = "";

            /**
             * Helper function to handle mixed .jpg and .jpeg extensions.
             * It tries .jpg first, then falls back to .jpeg on error.
             */
            const getSmartImgTag = (basePath, altName) => {
                return `<img src="${basePath}.jpg" 
                             width="300" 
                             alt="${altName}" 
                             onerror="if (this.src.endsWith('.jpg')) { this.src = '${basePath}.jpeg'; }">`;
            };

            if (input.includes("country")) {
                results.innerHTML = `
                    <h2>Country Recommendations</h2>
                    ${getSmartImgTag('images/country1', 'Country 1')}
                    ${getSmartImgTag('images/country2', 'Country 2')}
                `;
            } 
            else if (input.includes("temple")) {
                results.innerHTML = `
                    <h2>Temple Recommendations</h2>
                    ${getSmartImgTag('images/temple1', 'Temple 1')}
                    ${getSmartImgTag('images/temple2', 'Temple 2')}
                `;
            } 
            else if (input.includes("beach")) {
                results.innerHTML = `
                    <h2>Beach Recommendations</h2>
                    ${getSmartImgTag('images/beach1', 'Beach 1')}
                    ${getSmartImgTag('images/beach2', 'Beach 2')}
                `;
            } 
            else if (input !== "") {
                results.innerHTML = "<p>No results found. Try beach, temple, or country.</p>";
            }
        }

        function clearSearch() {
            document.getElementById("searchInput").value = "";
            document.getElementById("results").innerHTML = "";
        }
    </script>

</body>
</html>
